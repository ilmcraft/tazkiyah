org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# KSP adds its generated sources to Kotlin source sets, which AGP 9's built-in Kotlin disallows by default.
android.disallowKotlinSourceSets=false

# Public repository the app syncs content from (content lives in a sub-folder of this monorepo):
#   https://raw.githubusercontent.com/<owner>/<repo>/<branch>/<path>  (primary)
#   https://cdn.jsdelivr.net/gh/<owner>/<repo>@<branch>/<path>         (fallback)
tazkiyah.contentOwner=ilmcraft
tazkiyah.contentRepo=tazkiyah
tazkiyah.contentBranch=main
tazkiyah.contentPath=tazkiyah-content/
