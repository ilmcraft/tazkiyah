# Checks every change to the content tooling and catalog: schema/consistency validation and the test suite.
name: content-ci
on:
  pull_request:
    paths: ["tazkiyah-content/**", ".github/workflows/content-ci.yml"]
  push:
    branches: [main]
    paths:
      - "tazkiyah-content/scripts/**"
      - "tazkiyah-content/tests/**"
      - "tazkiyah-content/schema/**"
      - "tazkiyah-content/discovery/**"
      - ".github/workflows/content-ci.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tazkiyah-content
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tazkiyah-content/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Validate the catalog
        run: python scripts/validate.py
      - name: Tests
        run: python -m pytest -q
