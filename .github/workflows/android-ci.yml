# Lint, unit tests and a debug build for every change to the Android app (CLAUDE.md: lint and
# testDebugUnitTest must pass). Release builds are signed locally and are not built here.
name: android-ci
on:
  pull_request:
    paths: ["tazkiyah-android/**", ".github/workflows/android-ci.yml"]
  push:
    branches: [main]
    paths: ["tazkiyah-android/**", ".github/workflows/android-ci.yml"]
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tazkiyah-android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Lint, unit tests, debug build
        run: ./gradlew --no-daemon lint testDebugUnitTest assembleDebug
      - name: Keep reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            tazkiyah-android/app/build/reports/
            tazkiyah-android/app/build/test-results/
