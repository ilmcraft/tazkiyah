# Lint, unit tests and a debug build for every change to the Android app (CLAUDE.md: lint and
# testDebugUnitTest must pass). Release builds are signed locally and are not built here.
name: android-ci
on:
  pull_request:
    paths: ["tazkiyah-android/**", ".github/workflows/android-ci.yml"]
  push:
    branches: [main]
    paths: ["tazkiyah-android/**", ".github/workflows/android-ci.yml"]
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tazkiyah-android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Lint, unit tests, debug build
        run: ./gradlew --no-daemon lint testDebugUnitTest assembleDebug
      - name: Keep reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            tazkiyah-android/app/build/reports/
            tazkiyah-android/app/build/test-results/
